name: Deploy

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      # Bucket name / distribution ID / API endpoint are repo/environment
      # variables populated once manually after the first `terraform apply`
      # (see infra/outputs.tf) -- not fetched via `terraform output` here,
      # to keep this workflow's permissions limited to S3+CloudFront only
      # and decouple content deploys from Terraform-state availability.
      - name: Build
        env:
          PUBLIC_CONTACT_FORM_ENDPOINT: ${{ vars.CONTACT_FORM_API_ENDPOINT }}
        run: npm run build

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.CONTENT_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Sync to S3
        run: aws s3 sync ./dist s3://${{ vars.SITE_BUCKET_NAME }} --delete

      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"
