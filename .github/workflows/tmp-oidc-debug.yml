name: TEMP - OIDC sub claim debug

# Temporary, one-off check: confirms which `sub` claim format this repo's
# GitHub Actions OIDC tokens emit (legacy `repo:OWNER/REPO:...` vs the
# newer immutable `repo:OWNER@id/REPO@id:...` form), so infra/bootstrap's
# IAM trust policies can be written to match. Delete this file once you've
# read the output -- see infra/bootstrap/README.md.
#
# Requests and decodes the token directly via curl/jq (per GitHub's own
# OIDC reference: docs.github.com/en/actions/reference/security/oidc,
# "Requesting the JWT using environment variables") instead of a
# third-party action, since github/actions-oidc-debugger's Docker build
# was failing in this repo.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  oidc_debug:
    runs-on: ubuntu-latest
    steps:
      - name: Request and decode OIDC token
        run: |
          set -euo pipefail
          RESPONSE=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com")
          TOKEN=$(echo "$RESPONSE" | jq -r '.value')
          PAYLOAD_B64=$(echo "$TOKEN" | cut -d '.' -f2 | tr '_-' '/+')
          MOD=$(( ${#PAYLOAD_B64} % 4 ))
          if [ "$MOD" -eq 2 ]; then PAYLOAD_B64="${PAYLOAD_B64}=="; fi
          if [ "$MOD" -eq 3 ]; then PAYLOAD_B64="${PAYLOAD_B64}="; fi
          echo "Decoded OIDC token claims:"
          echo "$PAYLOAD_B64" | base64 -d | jq .
